name: Deploy Interest

# Ben's stopped-app hold remains: do not merge, dispatch, deploy, start, warm,
# ping or test-trigger forit-interest-accrual until he releases that hold.
# Source preparation and local checks do not authorize a runtime change.

on:
  push:
    branches: [main]
    paths:
      - 'interest/**'
      - '.github/workflows/interest.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: forit-interest-accrual
  AZURE_FUNCTIONAPP_PACKAGE_PATH: interest
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'
          cache-dependency-path: interest/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # This lane holds the destructive routes and the interest maths. Until
      # WO#1148 it had no tests at all; a failure here must stop the deploy.
      - name: Test
        run: npm test
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
