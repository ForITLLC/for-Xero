name: Deploy Connector

on:
  push:
    branches: [main]
    paths:
      - 'connector/**'
      - '.github/workflows/connector.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: forit-xero-mcp
  AZURE_FUNCTIONAPP_PACKAGE_PATH: connector
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, forit-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: connector/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Guards the raw-error leak class (WO#1137 D1). A failure here must stop
      # the deploy — that is the whole point of the step.
      - name: Test
        run: npm test
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Stamps the commit into the package so /api/health can report what the
      # running app actually is, rather than what a working copy claims.
      - name: Stamp build info
        run: |
          printf '{"commit":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-info.json
          cat build-info.json
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
